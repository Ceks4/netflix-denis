<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BizarreFlix</title>
<link rel="stylesheet" href="style.css">
</head>

<body class="paginaInicio">

<div class="mangaSfx mangaSfxInicio" aria-hidden="true">ゴゴゴ</div>

<!-- MENU SUPERIOR -->
<header class="navbar">
    <div class="logo">
        <img src="Imagens/logo-bizarreflix.png" alt="BizarreFlix" class="logoImagem">
    </div>

    <div class="perfil">
        <img src="Imagens/GatoFotodePerfil.jpg" class="fotoPerfil">
    </div>
</header>


<!-- BANNER PRINCIPAL -->
<section class="banner">
    <div class="banner-conteudo">
        <span class="seloParte">BIZARREFLIX ORIGINAL · PARTE 01</span>
        <h1>Uma maratona estranhamente incrível</h1>
        <p>Filmes, séries e aventuras capazes de despertar qualquer Stand.</p>

        <button class="btnAssistir">
            ▶ Assistir Agora
        </button>
    </div>
</section>


<!-- CONTEÚDO -->
<main class="container">

    <section class="lista">
        <h2><span>01</span> Filmes em Alta</h2>
        <div id="listaFilmes" class="carrossel"></div>
    </section>

    <section class="lista">
        <h2><span>02</span> Séries em Alta</h2>
        <div id="listaSeries" class="carrossel"></div>
    </section>

</main>

<script type="module" src="script.js"></script>

</body>
</html>
